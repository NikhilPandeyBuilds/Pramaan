services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./niyamai.db
      - SECRET_KEY=niyamai-docker-secret-key-32chars
      - FRONTEND_ORIGIN=http://localhost:5173
      - SEED_DEMO_DATA=true
    volumes:
      - ./storage:/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
